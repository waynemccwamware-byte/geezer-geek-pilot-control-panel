<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeezerGeek Pilot Apps &mdash; QR Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@600&display=swap" rel="stylesheet">
<style>
  :root { --amber: #f5a623; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
  }
  .frame {
    box-sizing: border-box;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    padding: 4vh 4vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3vh;
  }
  h1 {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: clamp(20px, 4.5vmin, 44px);
    letter-spacing: 0.01em;
    color: var(--amber);
    text-align: center;
  }
  h1 a {
    color: inherit;
    text-decoration: none;
    border-radius: 4px;
  }
  h1 a:hover { text-decoration: underline; text-underline-offset: 0.18em; }
  h1 a:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }
  img {
    /* square QR, as large as fits under the title */
    width: min(80vw, 60vh);
    height: auto;
    display: block;
    /* white quiet zone so phone cameras pick it up reliably on the black page */
    background: #fff;
    padding: min(3vw, 3vh);
    image-rendering: pixelated;
    box-sizing: border-box;
  }
</style>
</head>
<body>
  <div class="frame">
    <h1><a href="./" title="Back to GeezerGeek Pilot Apps">GeezerGeek Pilot Apps (free)</a></h1>
    <img src="qr-code.png" alt="QR code linking to GeezerGeek Pilot Apps control panel">
  </div>
</body>
</html>
